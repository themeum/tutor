schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Tutor LMS WordPress site. Primary code lives in two plugins:
  - wp-content/plugins/tutor (Tutor LMS core, text domain tutor, namespace TUTOR / Tutor\Models)
  - wp-content/plugins/tutor-pro (Tutor LMS Pro, text domain tutor-pro, namespace TUTOR_PRO)

  PHP 7.4+, WordPress 5.3+, WPCS (tabs, long array syntax, Yoda comparisons).
  React/TypeScript course builder under tutor/assets/src/js/v3 and tutor-pro addons.
  Quiz submit grades all-or-nothing in tutor/classes/Quiz.php, then Pro/H5P rewrite rows via
  tutor_filter_quiz_answer_data and tutor_filter_quiz_total_marks.
  Attempt rows: {prefix}tutor_quiz_attempt_answers.is_correct (tinyint, nullable).
  Option-bank rows: {prefix}tutor_quiz_question_answers.is_correct stays 0/1.
  Quiz settings live in tutor_quiz_option post meta and are snapshotted into attempt_info.
  Question settings live in serialized question_settings.
  Course-builder slots: Curriculum.Quiz.bottom_of_settings and Curriculum.Quiz.bottom_of_question_sidebar.
  Do not invent new DB columns for this feature. Do not rewrite the core submit loop.

